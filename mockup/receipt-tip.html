<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T28 Receipt Tip — pull the bill longer to tip</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the component from ../, dressed in Nocturne type */
  #stage{background:var(--room);--font:var(--f-text)}
  #stage .rb{position:absolute;left:40px;top:50px;zoom:1;z-index:1}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one, no fade at the loop seam */
</style>
</head>
<body>
<div id="stage" data-title="T28 Receipt Tip" data-url="veraetogrex-portfolio.github.io/receipt-tip">
  <section class="rb" id="bill" aria-label="Bill for table 12">
    <div class="rb-order">
      <p class="rb-brand"><b>VECTOR</b><span>Dine</span></p>
      <h1 class="rb-place">Casa Fumo</h1>
      <p class="rb-table">Table 12, 2 guests</p>
      <ul class="rb-dishes" aria-label="Your order">
        <li class="rb-dish" data-price="24">
          <span class="rb-plate"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="12.5"/><path d="M24 11.5V24l10.8 6.2"/><circle cx="19" cy="20" r="2"/><circle cx="28" cy="18" r="1.6"/><circle cx="20.5" cy="29" r="1.8"/><circle cx="29" cy="25.5" r="1.4"/></svg></span>
          <span class="rb-dish-t"><b>Margherita</b><small>Wood-fired, basil</small></span>
          <span class="rb-price">$24.00</span>
        </li>
        <li class="rb-dish" data-price="16">
          <span class="rb-plate"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 25h32a16 16 0 0 1-32 0z"/><circle cx="24" cy="19" r="5.5"/><path d="M13 22c1.5-4 4.5-5 7-4.5M35 22c-1.5-4-4.5-5-7-4.5M16 15.5c2-1 4-1 5 .5M32 15.5c-2-1-4-1-5 .5"/></svg></span>
          <span class="rb-dish-t"><b>Burrata salad</b><small>Heirloom tomato</small></span>
          <span class="rb-price">$16.00</span>
        </li>
      </ul>
    </div>

    <div class="rb-bill">
      <div class="rb-top"><p class="rb-sub"><span>Subtotal</span><b class="rb-sub-v">$40.00</b></p></div>
      <!-- the tip tape: hidden inside the bill, pulled out between subtotal and total; 1% of tip = one tick -->
      <div class="rb-slot" aria-hidden="true">
        <div class="rb-tape"><span class="rb-ticks"></span>
          <div class="rb-read"><p class="rb-read-t"><b>Tip <span class="rb-read-p">15%</span></b><span class="rb-read-of">of $40.00</span></p><p class="rb-read-v">$0.00</p></div>
        </div>
      </div>
      <div class="rb-foot">
        <button class="rb-tab" role="slider" aria-label="Tip, drag down to add" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" aria-valuetext="No tip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7.5l5 4.5 5-4.5M7 13l5 4.5 5-4.5"/></svg></button>
        <p class="rb-total-l">Total</p>
        <p class="rb-total" role="status" aria-label="Total $40.00">$40.00</p>
        <button class="rb-pay">Pay bill</button>
      </div>
    </div>

    <!-- the stops the bill clicks into; they are buttons too -->
    <div class="rb-scale" role="group" aria-label="Tip">
      <p class="rb-scale-h">Tip</p>
      <button class="rb-stop" data-rate="0"><b>No tip</b></button>
      <button class="rb-stop" data-rate="10"><b>10%</b><small></small></button>
      <button class="rb-stop" data-rate="15"><b>15%</b><small></small></button>
      <button class="rb-stop" data-rate="20"><b>20%</b><small></small></button>
    </div>
  </section>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const bill = document.querySelector('#bill').bill;
const grip = () => { const r = Stage.rect(bill.tab); return [r.cx + 4, r.cy]; };
Stage.init({
  reset: () => bill.reset(),
  get cursorStart() { return grip(); },                  // already holding the tab in frame one
  async demo(s) {
    const t0 = performance.now(), [x, y] = grip();
    await s.wait(100);
    await s.drag([x, y + 218], 950, { pre: 110, post: 70 });  // pull the bill to 15%: the tape comes out, total $46.00 (a hair past, it clicks back)
    await s.until(t0, 2450);
    await s.drag([x, y + 292], 520, { pre: 80, post: 60 });   // on to 20%: five more ticks, $8.00, $48.00
    await s.until(t0, 4250);
    await s.click(bill.stop(0), { ms: 420, dx: -6 });       // No tip: the bill closes in one push, the total counts down to $40.00
    await s.until(t0, 5450);
    await s.move([x, y], 380);                                // back on the tab: the loop closes on frame one
    await s.until(t0, 6050);
  },
});
</script>
</body>
</html>
